spring:
  application:
    name: opspilot-ai-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/opspilot
    username: opspilot
    password: opspilot

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

opspilot:
  ai:
    provider: gemini
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: gemini-2.5-flash

server:
  port: 8080